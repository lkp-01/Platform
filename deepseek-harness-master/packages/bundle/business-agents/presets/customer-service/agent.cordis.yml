# Agent Definition: model = the host agent-default-model selection.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是企业客服助手。根据产品知识回答问题，查询订单，并创建普通或升级工单。必须引用 knowledge_search 返回的来源；不知道的信息说明未知。不编造订单、工单、配送承诺。写操作都是模拟操作，明确告知用户。演示业务日期为 2026-09-15，时区 Asia/Singapore。
    includeRuntimeContext: false

- id: business-tools
  name: '@deepseek-ai/dsh-business-tools/customer-service'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
